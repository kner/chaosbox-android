plugins { id 'com.android.application' }
def installationName = providers.gradleProperty('installationName').getOrElse('')
if (installationName && !(installationName ==~ /[A-Za-z][A-Za-z0-9_-]{0,39}/)) {
    throw new GradleException('Invalid installationName')
}
// Derive a repeatable hue from the package suffix; updates retain their color.
def iconDigest = java.security.MessageDigest.getInstance('SHA-256').digest(installationName.getBytes('UTF-8'))
float iconHue = (((iconDigest[0] & 0xFF) << 8) | (iconDigest[1] & 0xFF)) / 65536.0f
def iconColor = { float brightness ->
    String.format('#%06X', java.awt.Color.HSBtoRGB(iconHue, 0.75f, brightness) & 0xFFFFFF)
}
def setupPath = providers.gradleProperty('setupFile').orElse(providers.environmentVariable('KBOX_SETUP_FILE')).getOrElse('')
if (!setupPath || !rootProject.file(setupPath).isFile()) {
    throw new GradleException('setup.ini fehlt. KBOX_SETUP_FILE=/absoluter/pfad/setup.ini setzen oder -PsetupFile=... übergeben. KBox-make-all erzeugt diese Datei automatisch.')
}
def setupAssets = tasks.register('prepareSetupAssets', Sync) {
    from(rootProject.file(setupPath)) { rename { 'setup.ini' }; into 'initial/Setup' }
    into layout.buildDirectory.dir('generated/setupAssets')
}
android {
    // Historical copies are retained; compile only the canonical implementations.
    sourceSets.main.java.exclude '**/* (*in Konflikt stehende Kopie*).java'
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/setupAssets'))
    namespace 'local.sshcopy'
    // Retain the original development certificate so installed copies can update.
    signingConfigs {
        debug {
            def originalDebugKey = rootProject.file('.tooling/android-user/debug.keystore')
            if (originalDebugKey.isFile()) {
                storeFile originalDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'local.sshcopy'; minSdk 26; targetSdk 35; versionCode 56; versionName rootProject.file('VERSION').text.trim() }
    defaultConfig {
        // Keep existing IDs stable; encode hyphenated names in a separate namespace.
        if (installationName) applicationIdSuffix installationName.contains('-')
            ? ".hyphenated.n${installationName.getBytes('UTF-8').encodeHex()}"
            : ".installation.${installationName}"
        resValue 'string', 'installation_directory', installationName ? "KBox-${installationName}" : 'ChaosBox-default'
        resValue 'color', 'installation_icon_background', installationName ? iconColor(0.52f) : '#173F5F'
        resValue 'color', 'installation_icon_accent', installationName ? iconColor(0.85f) : '#17A398'
        manifestPlaceholders = [appLabel: installationName ? "Kbox-${installationName}" : 'ChaosBox']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'] } }
}
dependencies {
    implementation 'com.github.mwiede:jsch:2.28.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
}

tasks.named('preBuild').configure { dependsOn(setupAssets) }
