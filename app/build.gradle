plugins { id 'com.android.application' }
android {
    namespace 'local.sshcopy'
    compileSdk 35
    defaultConfig { applicationId 'local.sshcopy'; minSdk 26; targetSdk 35; versionCode 6; versionName '2.4' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'] } }
}
dependencies {
    implementation 'com.github.mwiede:jsch:2.28.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
}
